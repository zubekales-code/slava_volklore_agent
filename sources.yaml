# =============================================================================
# SEZNAM ZDROJŮ
# =============================================================================
# Tenhle soubor můžeš upravovat bez programování — přímo v prohlížeči na GitHubu
# (otevři soubor -> ikona tužky -> uprav -> "Commit changes").
#
# Pravidla:
#   - Klidně přidávej / mazej řádky. Odsazení (mezery na začátku řádku) musí
#     zůstat stejné jako u ostatních položek ve stejné skupině.
#   - Pokud si nejsi jistá/ý formátem, zkopíruj existující položku a jen uprav
#     hodnoty.
#   - Když se nějaký zdroj přestane načítat (web ho zrušil, změnil adresu…),
#     skript ho podle zadání jen tiše přeskočí — nezastaví běh celého agenta.
#     Chybu uvidíš v logu běhu na GitHubu (záložka Actions).
# =============================================================================

