# levný jazykový model z ní vytáhne titulky a odkazy.
# 'listing_url' = adresa stránky, kde web ukazuje své nejnovější články.
# =============================================================================
no_rss_sources:
  - name: "Think with Google"
    category: "Marketing"
    listing_url: "https://business.google.com/en-all/think/"
    paywalled: false

  # --- Přesunuto sem z rss_sources 14. 8. 2026 -- adresa RSS vracela 404
  # (buď špatně odhadnutá, nebo web RSS opravdu zrušil). Teď je čte
  # záložní mechanismus: Jina Reader + AI extrakce z výpisu novinek.
